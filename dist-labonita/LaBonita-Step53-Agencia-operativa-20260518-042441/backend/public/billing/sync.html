<!doctype html><html><head><meta charset="utf-8"/><title>DelSol (outbox)</title><link rel="stylesheet" href="/style.css"/></head>
<body><div class="card"><p><a href="/admin.html">← Volver</a></p><h2>DelSol (outbox preparado)</h2>
<button id="reload">Actualizar</button><span id="s" class="muted"></span>
<table class="table" style="margin-top:10px;"><thead><tr><th>ID</th><th>Entidad</th><th>Entity ID</th><th>Status</th><th>Tries</th><th>Error</th></tr></thead><tbody id="rows"></tbody></table>
<p class="muted">Sync real con DelSol: NO implementado (solo outbox).</p>
</div>
<script type="module">
import { api } from "./app.js";
const s=document.getElementById("s");const rowsEl=document.getElementById("rows");
async function load(){const rows=await api("/sync/outbox");rowsEl.innerHTML="";rows.forEach(r=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${r.id}</td><td>${r.entity_type}</td><td>${r.entity_id}</td><td>${r.status}</td><td>${r.tries}</td><td>${r.last_error||""}</td>`;rowsEl.appendChild(tr);});}
reload.onclick=()=>load().catch(e=>s.textContent=e.message);
load().catch(e=>s.textContent=e.message);
</script></body></html>
