<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Admin - Peticiones + Checklist</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .layout { display: grid; grid-template-columns: 380px 1fr; gap: 16px; }
    .panel { border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
    .list-item { border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    .list-item:hover { background: #fafafa; }
    .badge { font-weight: bold; }
    .muted { color: #666; }
    .ok { color: green; }
    .err { color: #b00; }
    textarea { width: 100%; min-height: 80px; }
    button { margin-right: 8px; }
    code { background: #f5f5f5; padding: 2px 4px; border-radius: 4px; }
    .msg { border-bottom: 1px solid #eee; padding: 8px 0; }
    .msg .who { font-weight:bold; }
  </style>
</head>
<body>
  <h1>Admin — Peticiones + Checklist</h1>
  <p>
    <a href="/admin.html">← Volver</a>
    |
    <button id="logoutBtn">Salir</button>
  </p>

  <div class="layout">
    <div class="panel">
      <h2>Peticiones</h2>
      <button id="reloadBtn">Actualizar</button>
      <div id="list" style="margin-top:12px;">Cargando...</div>
    </div>

    <div class="panel">
      <h2>Detalle</h2>
      <div id="detail" class="muted">Seleccioná una petición.</div>
    </div>
  </div>

  <script type="module" src="/js/admin-peticiones.js"></script>
</body>
</html>
