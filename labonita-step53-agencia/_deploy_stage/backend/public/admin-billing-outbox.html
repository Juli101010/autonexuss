<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Billing Outbox</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { margin: 0; background: #f6f6f6; color: #1f1f1f; font-family: Inter, system-ui, Arial, sans-serif; }
    .page { max-width: 1140px; margin: 0 auto; padding: 20px; }
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 14px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .toolbar a, .toolbar button {
      border: 1px solid #d8d8d8; background: #fff; color: #222; border-radius: 10px;
      padding: 8px 12px; text-decoration: none; cursor: pointer; font: inherit;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #e4e4e4; padding: 8px; text-align: left; vertical-align: top; }
    pre { background: #f8f8f8; border: 1px solid #e4e4e4; border-radius: 8px; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>Billing Outbox (Core -> Billing)</h1>
      <div class="toolbar">
        <a href="/admin.html">Volver</a>
        <a href="/admin-facturacion.html">Facturacion</a>
        <button id="refreshBtn" type="button">Actualizar</button>
        <button id="processBtn" type="button">Procesar pendientes</button>
      </div>
      <pre id="status"></pre>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Peticion</th>
              <th>Accion</th>
              <th>Estado</th>
              <th>Intentos</th>
              <th>Error</th>
              <th>Creado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/js/admin-billing-outbox.js"></script>
</body>
</html>
