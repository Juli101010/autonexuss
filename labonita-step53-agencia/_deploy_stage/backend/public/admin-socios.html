<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administracion | Asociadas y perfiles</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body{margin:0;background:#f6f6f6;font-family:Inter,system-ui,Arial,sans-serif;color:#1f1f1f}
    .page{max-width:1180px;margin:0 auto;padding:20px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .head h1{margin:0;font-size:24px}
    .status{min-height:20px;font-weight:700}
    .status.ok{color:#0f7a3a}.status.err{color:#b42318}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px}
    .panel h2{margin:0 0 10px;font-size:18px}
    .list{display:grid;gap:10px}
    .row{border:1px solid #ececec;border-radius:12px;padding:10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .meta{display:grid;gap:4px}
    .meta .title{font-weight:800}
    .meta .small{font-size:12px;color:#666}
    button{border:0;border-radius:10px;padding:8px 10px;background:#111;color:#fff;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    @media(max-width:920px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <h1>Asociadas y perfiles</h1>
      <a href="/labonita-operativo.html">Volver al panel</a>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
    <div class="grid">
      <section class="panel">
        <h2>Asociadas activas</h2>
        <div id="socios" class="list"></div>
      </section>
      <section class="panel">
        <h2>Perfiles sin asociada</h2>
        <div id="nosocios" class="list"></div>
      </section>
    </div>
  </div>
  <script type="module" src="/js/admin-socios.js"></script>
</body>
</html>
