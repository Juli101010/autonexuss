<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Billing Login</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <div class="card">
    <h2>LaBonita Billing Service</h2>
    <div><label>Email</label><input id="email" type="email" placeholder="admin@demo.com"/></div>
    <div><label>Password</label><input id="password" type="password" placeholder="Password123!"/></div>
    <div class="row">
      <button id="btn">Entrar</button>
      <span id="s" class="muted"></span>
    </div>
  </div>

  <script type="module">
    import { api, setToken } from "./app.js";
    const s = document.getElementById("s");
    document.getElementById("btn").onclick = async () => {
      s.textContent = "...";
      try {
        const out = await api("/auth/login", { method: "POST", body: { email: email.value, password: password.value } });
        setToken(out.token);
        location.href = "/admin.html";
      } catch (e) {
        s.textContent = e.message;
      }
    };
  </script>
</body>
</html>
