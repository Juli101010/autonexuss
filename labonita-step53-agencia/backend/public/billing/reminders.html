<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Impagos</title>
  <link rel="stylesheet" href="/billing/style.css"/>
</head>
<body>
  <div class="card">
    <p><a href="/billing/admin.html">← Volver</a></p>
    <h2>Impagos</h2>
    <button id="reload">Actualizar</button>
    <span id="s" class="muted"></span>

    <table class="table" style="margin-top:10px;">
      <thead><tr><th>Factura</th><th>Cliente</th><th>Email</th><th>Venc.</th><th>Estado</th><th>Record.</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script type="module">
    import { api } from "./app.js";
    const s = document.getElementById("s");
    const rowsEl = document.getElementById("rows");

    async function load() {
      const out = await api("/reminders/overdue");
      rowsEl.innerHTML = "";
      out.rows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.legal_number || ("#" + r.id)}</td>
          <td>${r.customer_name}</td>
          <td>${r.customer_email || ""}</td>
          <td>${r.due_date || ""}</td>
          <td>${r.status}</td>
          <td>${r.reminder_count || 0}</td>
          <td><button>Generar email</button></td>
        `;
        tr.querySelector("button").onclick = async () => {
          try {
            await api(`/invoices/${r.id}/remind`, { method: "POST" });
            alert("Email creado en outbox.");
            await load();
          } catch (e) { alert(e.message); }
        };
        rowsEl.appendChild(tr);
      });
    }

    document.getElementById("reload").onclick = () => load().catch(e => s.textContent = e.message);
    load().catch(e => s.textContent = e.message);
  </script>
</body>
</html>
