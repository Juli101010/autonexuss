<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Controles</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { margin: 0; background: #f6f6f6; color: #1f1f1f; font-family: Inter, system-ui, Arial, sans-serif; }
    .page { max-width: 1140px; margin: 0 auto; padding: 20px; }
    .panel { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .downloads { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .downloads button {
      width: 100%; text-align: left; border: 1px solid #d8d8d8; background: #fff; color: #222;
      border-radius: 10px; padding: 10px 12px; cursor: pointer; font: inherit;
    }
    label { display: block; margin-bottom: 8px; }
    input, select, button { font: inherit; }
    input, select { border: 1px solid #d8d8d8; border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
    .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    pre { background: #f8f8f8; border: 1px solid #e4e4e4; border-radius: 8px; padding: 10px; white-space: pre-wrap; }
    .toolbar a {
      border: 1px solid #d8d8d8; background: #fff; color: #222; border-radius: 10px; padding: 8px 12px; text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="toolbar row">
        <h1 style="margin:0;">Controles (exports)</h1>
        <a href="/admin.html">Volver</a>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <strong>Formato</strong>
        <select id="formatSel" style="max-width:180px;">
          <option value="csv">CSV</option>
          <option value="xlsx">XLSX</option>
        </select>
      </div>
      <ul class="downloads" style="margin-top:12px;">
        <li><button data-endpoint="/api/admin/controls/monthly-payroll">Control mensual altas/nominas</button></li>
        <li><button data-endpoint="/api/admin/controls/ss-diario">SS diario (altas/bajas por dia)</button></li>
        <li><button data-endpoint="/api/admin/controls/gastos">Control gastos</button></li>
        <li><button data-endpoint="/api/admin/controls/puntuales">Control puntuales</button></li>
        <li><button data-endpoint="/api/admin/controls/control-total">Control total (en cero)</button></li>
        <li><button data-endpoint="/api/admin/controls/commissions">Comisiones mensuales</button></li>
        <li><button data-endpoint="/api/admin/controls/ledger">Ledger movimientos (cobros/pagos/ajustes)</button></li>
      </ul>
    </section>

    <section class="panel">
      <h2 style="margin-top:0;">Agregar comision (manual)</h2>
      <form id="commissionForm" class="grid">
        <label>Petition ID <input name="petition_id" required /></label>
        <label>Mes (YYYY-MM) <input name="month" required placeholder="2026-02" /></label>
        <label>Concepto <input name="label" required /></label>
        <label>Importe (EUR) <input name="amount_eur" required type="number" step="0.01" /></label>
        <div><button type="submit">Guardar comision</button></div>
      </form>
      <pre id="result"></pre>
    </section>
  </main>
  <script src="/js/admin-controles.js"></script>
</body>
</html>
